<div>
  <div class="container py-4">
    <div class="page-header">
      <h1 class="page-title"><i class="bi bi-lightbulb me-2 text-warning"></i>인사이트</h1>
      <p class="page-subtitle">『이길 수 있는 투자만 하라』의 핵심 메시지를 데이터로 확인하세요</p>
    </div>

    <!-- 파트 필터 -->
    <div class="btn-group-selector insights-filter mb-4">
      <button
        v-for="p in parts"
        :key="p.key"
        class="btn"
        :class="{ active: activeSection === p.key }"
        @click="activeSection = p.key"
      >{{ p.label }}</button>
    </div>

    <div class="row g-3">
      <div class="col-12 col-md-6" v-for="card in filteredCards" :key="card.id">
        <article class="insight-card h-100">
          <header class="insight-card-head">
            <span class="insight-icon"><i class="bi" :class="card.icon"></i></span>
            <div class="insight-meta">
              <span class="insight-part">{{ card.part }}</span>
              <span class="insight-chapter" v-if="card.chapter">{{ card.chapter }}</span>
            </div>
          </header>

          <h3 class="insight-title">{{ card.title }}</h3>
          <p class="insight-message">{{ card.message }}</p>

          <footer class="insight-card-foot">
            <p class="insight-source" v-if="card.source">
              <i class="bi bi-journal-text"></i>{{ card.source }}
            </p>
            <a
              href="#"
              class="insight-link"
              v-if="card.link"
              @click.prevent="navigateTo(card.link)"
            >데이터로 확인하기<i class="bi bi-arrow-right-short"></i></a>
          </footer>
        </article>
      </div>
    </div>
  </div>
</div>
