# 로컬 UI 확인 전용 설정 (배포에 사용하지 않음)
# wrangler.toml 과 동일하되, Cloudflare 인증이 필요한 [ai] 바인딩과 [triggers] 를 제외한다.
# 사용: npx wrangler dev --config wrangler.dev-local.toml
name = "index-power-forever-dev"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../frontend"
# SPA 폴백은 Worker가 담당한다 (없는 경로에 404 상태를 주기 위함 — soft 404 방지)
not_found_handling = "none"
binding = "ASSETS"
# SPA 페이지 요청은 Worker가 먼저 처리한다 (라우트별 SEO 메타 주입).
# css/js/images 등 실제 파일은 그대로 정적 서빙된다.
run_worker_first = [
  "/",
  "/sitemap.xml",
  "/ranking",
  "/timing",
  "/fee-simulator",
  "/retirement",
  "/withdrawal",
  "/insights",
  "/book",
  "/manual",
  "/etf/*",
]

[[d1_databases]]
binding = "DB"
database_name = "index-power-forever"
database_id = "d83bdf6e-ce60-47d3-a415-455f24b69295"

[[kv_namespaces]]
binding = "KV"
id = "d9325ab1fd164d17bb4065dbcbb4515e"
